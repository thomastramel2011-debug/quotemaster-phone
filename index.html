<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Termite Quote</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f1ea;color:#1c1915}
main{max-width:28rem;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:1.25rem;margin:0 0 .25rem}
label{display:block;font-size:.85rem;margin:.7rem 0 .2rem}
input,select{width:100%;font-size:1rem;padding:.6rem;border:1px solid #c9c2b2;border-radius:8px;box-sizing:border-box}
button{width:100%;margin-top:1rem;padding:.8rem;font-size:1rem;border:0;border-radius:8px;background:#2f5d3a;color:#fff}
.price{background:#fff;border-radius:10px;padding:.8rem 1rem;margin-top:1rem}
.price b{font-size:1.3rem}
.hidden{display:none}
.note{font-size:.8rem;color:#5c564c}
.err{color:#8a2a1a;font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Family Termite quote</h1>
<form id="login">
<p class="note">One login for all techs.</p>
<label>Username</label>
<input id="user" autocomplete="username">
<label>Password</label>
<input id="password" type="password" autocomplete="current-password">
<p id="err" class="err"></p>
<button type="submit">Sign in</button>
</form>
<div id="quote" class="hidden">
<label>Customer name</label>
<input id="cname" autocomplete="name">
<label>Address</label>
<input id="caddress" autocomplete="street-address">
<label>Telephone</label>
<input id="cphone" inputmode="tel" autocomplete="tel">
<label>What are you quoting?</label>
<select id="service">
<option value="pretreat">Pre-treatment</option>
<option value="post">Post-treatment</option>
<option value="pest">Pest service</option>
<option value="other">Other / one-time</option>
</select>
<div id="panel"></div>
<button type="button" id="calc">Show price</button>
<div class="price" id="out">Pick a service, then show the price.</div>
<label>Customer printed name</label>
<input id="signname">
<label>Date</label>
<input id="signdate" type="date">
<label>Customer signature</label>
<canvas id="sign" width="600" height="160" style="width:100%;height:160px;background:#fff;border:1px solid #c9c2b2;border-radius:8px;touch-action:none"></canvas>
<button type="button" id="clearsign" style="background:#6b6458">Clear signature</button>
<p class="note">One offer. If they say yes, write the item, this price, and the date on the ticket and tell the office before the end of the day. If they say no, stop.</p>
</div>
</main>
<script src="pricing.js"></script>
<script src="app.js"></script>
</body>
</html>
