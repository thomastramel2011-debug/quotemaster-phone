<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Termite &amp; Environmental Services</title>
<style>
body{margin:0;background:#d5d5d5;color:#111;font-family:"Times New Roman",Times,"Noto Serif",serif}
[hidden]{display:none !important}
#gate{max-width:24rem;margin:0 auto;padding:1.4rem .9rem 2rem}
#gate .card{background:#fff;border:1px solid #000;padding:1.15rem 1rem 1.05rem}
#gate .logo{font-style:italic;font-weight:700;text-align:center;font-size:clamp(1.15rem,5.2vw,1.45rem);line-height:1.2;margin:0;padding-bottom:.45rem;border-bottom:3px solid #000}
#gate .sub{text-align:center;font-size:.98rem;margin:.8rem 0 .1rem}
#gate label{display:block;font-size:.8rem;margin:.75rem 0 .28rem}
#gate input{width:100%;box-sizing:border-box;font-family:"Times New Roman",Times,"Noto Serif",serif;font-size:16px;padding:.55rem .45rem;border:1px solid #000;border-radius:0;background:#fff;color:#111}
#gate input:focus{outline:2px solid #111;outline-offset:1px}
#gate button{width:100%;box-sizing:border-box;margin-top:.85rem;padding:.7rem .4rem;min-height:48px;font-family:"Times New Roman",Times,"Noto Serif",serif;font-size:1rem;font-weight:700;border:1.5px solid #000;border-radius:0;background:#111;color:#fff}
#gate button:disabled{opacity:.7}
#gate .err{color:#8a1c1c;font-size:.9rem;line-height:1.3;min-height:1.2em;margin:.55rem 0 0}
#opening{text-align:center;margin:2rem 1rem;font-size:1rem}
.sessionbar{max-width:28rem;margin:0 auto;padding:.45rem .45rem 0;box-sizing:border-box}
#signout{display:block;width:100%;box-sizing:border-box;margin:0 0 .45rem;padding:.55rem .4rem;min-height:44px;font-family:"Times New Roman",Times,"Noto Serif",serif;font-size:1rem;font-weight:700;border:1.5px solid #000;border-radius:0;background:#fff;color:#111}
</style>
</head>
<body>
<div id="gate">
<form id="login" class="card" method="post" action="#">
<p class="logo">Family Termite &amp; Environmental Services</p>
<p class="sub">Tech sign in</p>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
<p id="err" class="err" role="alert"></p>
<button type="submit" id="signin">Sign in</button>
</form>
<noscript><p class="sub">Turn on JavaScript to sign in.</p></noscript>
</div>
<p id="opening" hidden>Opening…</p>
<div id="session" hidden>
<div class="sessionbar">
<button type="button" id="signout">Sign out</button>
</div>
<div id="app"></div>
</div>
<script id="sealed" type="application/json">{"v":1,"configured":false}</script>
<script>
(function () {
  var SESSION_KEY = "familyTermiteQuoteSession";
  var REMEMBER_MS = 30 * 24 * 60 * 60 * 1000;
  var sealed = JSON.parse(document.getElementById("sealed").textContent);
  var form = document.getElementById("login");
  var passwordInput = document.getElementById("password");
  var err = document.getElementById("err");
  var button = document.getElementById("signin");
  var gate = document.getElementById("gate");
  var sessionBox = document.getElementById("session");
  var opening = document.getElementById("opening");
  var busy = false;

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function bytesToB64(bytes) {
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  function loadSession() {
    var raw;
    try { raw = localStorage.getItem(SESSION_KEY); } catch (e) { return null; }
    if (!raw) return null;
    try {
      var record = JSON.parse(raw);
      if (!record || typeof record.key !== "string" || typeof record.exp !== "number" || record.exp < Date.now()) {
        clearSession();
        return null;
      }
      return record;
    } catch (e) {
      clearSession();
      return null;
    }
  }

  function saveSession(key) {
    return crypto.subtle.exportKey("raw", key).then(function (raw) {
      try {
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          exp: Date.now() + REMEMBER_MS,
          key: bytesToB64(new Uint8Array(raw))
        }));
      } catch (e) {}
    });
  }

  function deriveKey(password) {
    return crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    ).then(function (base) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(sealed.salt), iterations: sealed.iter, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        true,
        ["decrypt"]
      );
    });
  }

  function importSessionKey(b64) {
    return crypto.subtle.importKey("raw", b64ToBytes(b64), { name: "AES-GCM" }, false, ["decrypt"]);
  }

  function decryptWith(key) {
    return crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(sealed.iv) },
      key,
      b64ToBytes(sealed.ct)
    ).then(function (plain) {
      return new TextDecoder().decode(plain);
    });
  }

  function showGate(message) {
    busy = false;
    button.disabled = false;
    button.textContent = "Sign in";
    opening.hidden = true;
    sessionBox.hidden = true;
    gate.hidden = false;
    err.textContent = message || "";
    if (!message) passwordInput.focus();
  }

  function openQuote(text) {
    var payload = JSON.parse(text);
    var app = document.getElementById("app");
    app.innerHTML = payload.html || "";
    (payload.js || []).forEach(function (code) {
      var script = document.createElement("script");
      script.textContent = code;
      document.body.appendChild(script);
    });
    passwordInput.value = "";
    gate.hidden = true;
    opening.hidden = true;
    sessionBox.hidden = false;
    busy = false;
  }

  function fail(error) {
    var wrong = error && (error.name === "OperationError" || error.name === "InvalidAccessError");
    showGate(wrong ? "That password does not match." : "Could not open the quote tool on this phone.");
  }

  document.getElementById("signout").addEventListener("click", function () {
    clearSession();
    location.reload();
  });

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (busy) return;
    if (!window.crypto || !crypto.subtle) {
      showGate("This phone cannot open the quote tool. Update the browser and try again.");
      return;
    }
    if (!sealed || sealed.configured !== true) {
      showGate("Sign-in is not set up yet. Call the office.");
      return;
    }
    var password = passwordInput.value;
    if (!password) {
      showGate("Enter the tech password.");
      return;
    }
    busy = true;
    button.disabled = true;
    button.textContent = "Checking…";
    err.textContent = "";
    window.requestAnimationFrame(function () {
      window.setTimeout(function () {
        deriveKey(password).then(function (key) {
          return decryptWith(key).then(function (text) {
            return saveSession(key).then(function () { return text; });
          });
        }).then(openQuote).catch(function (error) {
          clearSession();
          fail(error);
        });
      }, 30);
    });
  });

  if (!window.crypto || !crypto.subtle) {
    showGate("This phone cannot open the quote tool. Update the browser and try again.");
    return;
  }
  var saved = sealed && sealed.configured === true ? loadSession() : null;
  if (saved) {
    gate.hidden = true;
    opening.hidden = false;
    busy = true;
    importSessionKey(saved.key).then(decryptWith).then(openQuote).catch(function () {
      clearSession();
      showGate("");
    });
  } else {
    passwordInput.focus();
  }
})();

</script>
</body>
</html>
